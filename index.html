<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c5c3b8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Zombie Snack</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/silvia.css" />
    <link rel="stylesheet" href="css/mobile-touch-fix.css" />
  </head>
  <body>
    <main class="cabinet">
      <h1 class="cabinet__title">ZOMBIE SNACK</h1>

      <div class="handheld">
        <div class="handheld__bezel">
          <div class="screen">
            <canvas id="game" width="960" height="540"></canvas>
          </div>
          <p class="handheld__caption">DOT MATRIX WITH STEREO SOUND</p>
        </div>

        <div id="touch-pad" class="touch-pad" aria-label="Comandi portatile">
          <div class="gb-dpad" aria-label="Croce direzionale">
            <button type="button" class="gb-dpad__btn gb-dpad__btn--up" data-action="up" aria-label="Salta"></button>
            <button type="button" class="gb-dpad__btn gb-dpad__btn--left" data-action="left" aria-label="Sinistra"></button>
            <span class="gb-dpad__nub" aria-hidden="true"></span>
            <button type="button" class="gb-dpad__btn gb-dpad__btn--right" data-action="right" aria-label="Destra"></button>
            <button type="button" class="gb-dpad__btn gb-dpad__btn--down" data-action="down" aria-label="Abbassati"></button>
          </div>

          <div class="gb-face">
            <div class="gb-ab">
              <div class="gb-ab__slot gb-ab__slot--x">
                <button type="button" class="gb-round gb-round--x" data-action="dodge" aria-label="Scatto">
                  <span>X</span>
                </button>
                <span class="gb-ab__label">SCATTO</span>
              </div>
              <div class="gb-ab__slot gb-ab__slot--y">
                <button type="button" class="gb-round gb-round--y gb-round--super" data-action="super" aria-label="Super">
                  <span>Y</span>
                </button>
                <span class="gb-ab__label">SUPER</span>
              </div>
              <div class="gb-ab__slot gb-ab__slot--b">
                <button type="button" class="gb-round" data-action="attack" aria-label="Attacca">
                  <span>B</span>
                </button>
                <span class="gb-ab__label">ATTACCA</span>
              </div>
              <div class="gb-ab__slot gb-ab__slot--a">
                <button type="button" class="gb-round" data-action="jump" aria-label="Salta">
                  <span>A</span>
                </button>
                <span class="gb-ab__label">SALTA</span>
              </div>
            </div>
          </div>

          <div class="gb-pills">
            <button type="button" class="gb-pill" data-action="back">
              <span class="gb-pill__key"></span>
              <span class="gb-pill__name">SELECT</span>
            </button>
            <button type="button" class="gb-pill" data-action="pause">
              <span class="gb-pill__key"></span>
              <span class="gb-pill__name">START</span>
            </button>
          </div>
          <div style="position:absolute; left:50%; transform:translateX(-50%); bottom:9px; font:9px monospace; opacity:.42; letter-spacing:.4px; pointer-events:none;">1.8.0</div>
        </div>

        <div class="gb-speaker" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <section class="legend">
        <h2>Comandi</h2>
        <ul>
          <li><kbd>&larr;</kbd> <kbd>&rarr;</kbd> <span>Muoviti</span></li>
          <li><kbd>Spazio</kbd> <span>Salta (doppio salto)</span></li>
          <li><kbd>&darr;</kbd> <span>Abbassati</span></li>
          <li><kbd>X</kbd> <span>Scatto invulnerabile</span></li>
          <li><kbd>F</kbd> <span>Attacca</span></li>
          <li><kbd>Y</kbd> <span>Super (quando disponibile)</span></li>
          <li><kbd>P</kbd> <span>Pausa</span></li>
          <li><kbd>Esc</kbd> <span>Esci dalla partita (con conferma)</span></li>
        </ul>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/input.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/boss.js"></script>
    <script src="js/scores.js"></script>
    <script src="js/game.js"></script>
    <script src="js/silvia.js"></script>
    <script src="js/silvia-polish.js"></script>
    <script src="js/boledj.js"></script>
    <script src="js/boledj-multihit.js"></script>
    <script src="js/boledj-tuning.js"></script>
    <script src="js/character-lives.js"></script>
    <script src="js/luca90.js"></script>
    <script src="js/eb.js"></script>
    <script src="js/carota.js"></script>
    <script src="js/fabio.js"></script>
    <script src="js/dario.js"></script>
    <script src="js/menu-polish.js"></script>
    <script src="js/audio.js?v=1.9.0"></script>
  </body>
</html>
